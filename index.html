<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deven Ballback's Skin Game</title>
<meta name="description" content="Deven Ballback's personal website — an interactive skin-changing playground at devenballback.skin.">
<link rel="canonical" href="https://devenballback.skin/">
<meta property="og:title" content="Deven Ballback's Skin Game">
<meta property="og:description" content="Deven Ballback's personal website — an interactive skin-changing playground.">
<meta property="og:url" content="https://devenballback.skin/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Deven Ballback's Skin Game">
<meta name="twitter:description" content="Deven Ballback's personal website.">
<style>
  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
<style>
  :root {
    --bg1: #3a2818;
    --bg2: #0c0805;
    --accent: #ffb98a;
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: default;
  }
  body {
    position: relative;
    background: radial-gradient(circle at 50% 50%, var(--bg1), var(--bg2) 70%);
    transition: background 0.6s ease;
  }

  #blob {
    position: absolute;
    top: 0; left: 0;
    font-size: clamp(40px, 9vw, 96px);
    line-height: 1;
    white-space: nowrap;
    user-select: none;
    will-change: transform;
    filter: drop-shadow(0 0 18px var(--accent));
    transition: filter 0.4s ease;
  }

  #counter {
    position: absolute;
    top: 18px;
    right: 22px;
    color: var(--accent);
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    user-select: none;
    transition: color 0.6s ease;
  }

  #skindexbtn {
    position: absolute;
    top: 14px;
    left: 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: var(--accent);
    font-size: 16px;
    line-height: 1;
    width: 36px;
    height: 36px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s ease, transform 0.15s ease, color 0.6s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #skindexbtn:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }
  #skindexbtn:active { transform: translateY(0) scale(0.92); }

  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    top: 0; left: 0;
    will-change: transform, opacity;
  }

  .peel {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
  }
  .peel.show {
    animation: peelOff 0.7s ease forwards;
  }
  @keyframes peelOff {
    0%   { opacity: 0.9; clip-path: inset(0 0 0 0); }
    100% { opacity: 0; clip-path: inset(0 100% 0 0); }
  }

  /* ---------- unlock toast ---------- */
  #toast {
    position: fixed;
    top: 14%;
    left: 50%;
    transform: translate(-50%, -12px);
    font-size: 15px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.02em;
    color: #fff;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 16px;
    border-radius: 10px;
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    text-align: center;
    white-space: nowrap;
    z-index: 20;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ---------- skindex overlay ---------- */
  #skindex-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    overflow-y: auto;
    padding: 40px 16px;
  }
  #skindex-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  #skindex-panel {
    width: min(560px, 100%);
    color: #eee;
    text-align: center;
  }
  #skindex-panel h2 {
    font-size: 22px;
    letter-spacing: 0.12em;
    margin: 0 0 4px;
    color: var(--accent);
    transition: color 0.6s ease;
  }
  #skindex-sub {
    font-size: 13px;
    color: #999;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-bottom: 22px;
  }
  #skindex-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 12px;
  }
  .skindex-tile {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 14px 8px 10px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .skindex-tile:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
  .skindex-tile.active { border-color: var(--accent); }
  .skindex-tile.locked { cursor: default; opacity: 0.55; }
  .skindex-tile.locked:hover { background: rgba(255,255,255,0.06); transform: none; }
  .skindex-emoji { font-size: 34px; line-height: 1; }
  .skindex-name {
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #ccc;
  }
  .skindex-lock {
    font-size: 10px;
    color: #888;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #skindex-close {
    margin-top: 26px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #eee;
    font-size: 13px;
    font-family: inherit;
    padding: 9px 20px;
    border-radius: 999px;
    cursor: pointer;
  }
  #skindex-close:hover { background: rgba(255,255,255,0.16); }
</style>
</head>
<body>
  <h1 class="visually-hidden">Deven Ballback's Skin Game</h1>
  <p class="visually-hidden">The personal website of Deven Ballback, at devenballback.skin. Click around to earn clicks and unlock new skins in the Skindex.</p>
  <button id="skindexbtn" title="open Skindex">📖</button>
  <div id="counter">0</div>
  <div id="blob"></div>
  <div id="toast"></div>

  <div id="skindex-overlay">
    <div id="skindex-panel">
      <h2>SKINDEX</h2>
      <div id="skindex-sub"></div>
      <div id="skindex-grid"></div>
      <button id="skindex-close">close</button>
    </div>
  </div>

<script>
(function () {
  // ---------- skin roster ----------
  // A diverse cast of humans — different ages, features, and skin tones —
  // unlocked progressively the more you click around.
  var skins = [
    { id: 0, name: "Skin #01", emoji: "🧑🏻", unlockAt: 0,   bg1: "#3a2818", bg2: "#0c0805", accent: "#ffb98a", particles: ["#ffb98a", "#e69a63", "#ffd9b8", "#c97a3f"] },
    { id: 1, name: "Skin #02", emoji: "🧑🏼", unlockAt: 5,   bg1: "#3a2f05", bg2: "#0a0700", accent: "#f2c14e", particles: ["#f2c14e", "#d9a52e", "#ffe08a", "#a67c1a"] },
    { id: 2, name: "Skin #03", emoji: "🧑🏽", unlockAt: 12,  bg1: "#3a1010", bg2: "#0a0303", accent: "#ff6b6b", particles: ["#ff6b6b", "#e04545", "#ff9e9e", "#b32c2c"] },
    { id: 3, name: "Skin #04", emoji: "🧑🏾", unlockAt: 22,  bg1: "#22103a", bg2: "#06020a", accent: "#9d7fff", particles: ["#9d7fff", "#7d5be0", "#c6b3ff", "#5a3dbf"] },
    { id: 4, name: "Skin #05", emoji: "🧑🏿", unlockAt: 35,  bg1: "#0a2e2c", bg2: "#020807", accent: "#4bd2c9", particles: ["#4bd2c9", "#2ea89f", "#8cf0e6", "#1c7e77"] },
    { id: 5, name: "Skin #06", emoji: "👶🏽", unlockAt: 52,  bg1: "#3a1028", bg2: "#0a0208", accent: "#ff8fc7", particles: ["#ff8fc7", "#e0609f", "#ffc2e0", "#b83d7c"] },
    { id: 6, name: "Skin #07", emoji: "🧓🏻", unlockAt: 72,  bg1: "#1c1c1c", bg2: "#050505", accent: "#cfd8dc", particles: ["#cfd8dc", "#90a4ae", "#eceff1", "#607d8b"] },
    { id: 7, name: "Skin #08", emoji: "🧔🏾", unlockAt: 95,  bg1: "#2f2205", bg2: "#080601", accent: "#d99a3d", particles: ["#d99a3d", "#b87c22", "#f0c57a", "#8f5f14"] },
    { id: 8, name: "Skin #09", emoji: "🧑🏿‍🦱", unlockAt: 120, bg1: "#3a0c14", bg2: "#0a0204", accent: "#ff4d6d", particles: ["#ff4d6d", "#d92e4d", "#ff8fa3", "#a3132c"] }
  ];

  // ---------- persistence ----------
  var STORAGE_CLICKS = 'skindex_clicks';
  var STORAGE_CURRENT = 'skindex_current';

  function loadClicks() {
    try {
      var v = parseInt(localStorage.getItem(STORAGE_CLICKS), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }
  function saveClicks(v) {
    try { localStorage.setItem(STORAGE_CLICKS, String(v)); } catch (e) {}
  }
  function loadCurrent() {
    try {
      var v = parseInt(localStorage.getItem(STORAGE_CURRENT), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }
  function saveCurrent(v) {
    try { localStorage.setItem(STORAGE_CURRENT, String(v)); } catch (e) {}
  }

  function isUnlocked(skin, clicks) { return clicks >= skin.unlockAt; }
  function unlockedSkins(clicks) { return skins.filter(function (s) { return isUnlocked(s, clicks); }); }

  var count = loadClicks();
  var skinIdx = loadCurrent();
  if (!isUnlocked(skins[skinIdx], count)) skinIdx = 0;

  var root = document.documentElement;
  var blob = document.getElementById('blob');
  var skindexbtn = document.getElementById('skindexbtn');
  var body = document.body;
  var counterEl = document.getElementById('counter');
  var toastEl = document.getElementById('toast');
  var overlay = document.getElementById('skindex-overlay');
  var grid = document.getElementById('skindex-grid');
  var sub = document.getElementById('skindex-sub');
  var closeBtn = document.getElementById('skindex-close');

  function applySkin(i, animate) {
    var s = skins[i];
    skinIdx = i;
    saveCurrent(i);
    root.style.setProperty('--bg1', s.bg1);
    root.style.setProperty('--bg2', s.bg2);
    root.style.setProperty('--accent', s.accent);
    blob.textContent = s.emoji;
    skindexbtn.title = 'open Skindex (current: ' + s.name + ')';
    if (animate) {
      var peel = document.createElement('div');
      peel.className = 'peel show';
      peel.style.background = 'linear-gradient(90deg, ' + s.bg1 + ', ' + s.bg2 + ')';
      body.appendChild(peel);
      setTimeout(function () { peel.remove(); }, 750);
    }
  }
  applySkin(skinIdx, false);
  counterEl.textContent = count;

  // ---------- toast ----------
  var toastTimeout;
  function showToast(text) {
    clearTimeout(toastTimeout);
    toastEl.textContent = text;
    toastEl.classList.add('show');
    toastTimeout = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  // ---------- skindex overlay ----------
  function renderSkindex() {
    var unlockedCount = unlockedSkins(count).length;
    sub.textContent = unlockedCount + ' / ' + skins.length + ' unlocked';
    grid.innerHTML = '';
    skins.forEach(function (s) {
      var unlocked = isUnlocked(s, count);
      var tile = document.createElement('div');
      tile.className = 'skindex-tile' + (unlocked ? '' : ' locked') + (unlocked && s.id === skinIdx ? ' active' : '');
      if (unlocked) {
        tile.innerHTML = '<div class="skindex-emoji">' + s.emoji + '</div><div class="skindex-name">' + s.name + '</div>';
        tile.addEventListener('click', function (e) {
          e.stopPropagation();
          applySkin(s.id, true);
          closeSkindex();
        });
      } else {
        tile.innerHTML = '<div class="skindex-emoji">❔</div><div class="skindex-name">???</div><div class="skindex-lock">🔒 ' + s.unlockAt + ' clicks</div>';
      }
      grid.appendChild(tile);
    });
  }

  function openSkindex() {
    renderSkindex();
    overlay.classList.add('show');
  }
  function closeSkindex() {
    overlay.classList.remove('show');
  }

  skindexbtn.addEventListener('click', function (e) {
    e.stopPropagation();
    openSkindex();
  });
  closeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    closeSkindex();
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) {
      e.stopPropagation();
      closeSkindex();
    }
  });

  // ---------- bounce ----------
  var x = Math.random() * (window.innerWidth - 200);
  var y = Math.random() * (window.innerHeight - 100);
  var dx = 2.4, dy = 2.1;

  function tick() {
    var w = blob.offsetWidth, h = blob.offsetHeight;
    x += dx; y += dy;
    if (x <= 0 || x + w >= window.innerWidth) { dx *= -1; x = Math.max(0, Math.min(x, window.innerWidth - w)); }
    if (y <= 0 || y + h >= window.innerHeight) { dy *= -1; y = Math.max(0, Math.min(y, window.innerHeight - h)); }
    blob.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- click fun ----------
  function burst(cx, cy) {
    var pal = skins[skinIdx].particles;
    for (var i = 0; i < 14; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = 6 + Math.random() * 6;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = pal[Math.floor(Math.random() * pal.length)];
      document.body.appendChild(p);
      var angle = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 90;
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist;
      var start = performance.now();
      var life = 500 + Math.random() * 300;
      (function (p, tx, ty, start, life) {
        function frame(now) {
          var t = (now - start) / life;
          if (t >= 1) { p.remove(); return; }
          var ease = 1 - Math.pow(1 - t, 2);
          p.style.transform = 'translate(' + (cx + tx * ease) + 'px,' + (cy + ty * ease - t * 40) + 'px)';
          p.style.opacity = 1 - t;
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })(p, tx, ty, start, life);
    }
  }

  var lastClickTime = 0;
  document.addEventListener('click', function (e) {
    if (overlay.classList.contains('show')) return;
    if (e.target === skindexbtn) return;
    var now = performance.now();
    if (now - lastClickTime < 60) return; // debounce duplicate synthetic events
    lastClickTime = now;

    count++;
    saveClicks(count);
    counterEl.textContent = count;
    burst(e.clientX, e.clientY);

    var justUnlocked = skins.find(function (s) { return s.unlockAt === count; });
    if (justUnlocked) {
      showToast('🔓 new skin unlocked — ' + justUnlocked.name);
    }
  });

  window.addEventListener('resize', function () {
    x = Math.min(x, window.innerWidth - blob.offsetWidth);
    y = Math.min(y, window.innerHeight - blob.offsetHeight);
  });
})();
</script>
</body>
</html>
