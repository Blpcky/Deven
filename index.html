<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deven Ballback</title>
<meta name="description" content="Deven Ballback's personal site. Collector of skins.">
<link rel="canonical" href="https://devenballback.skin/">
<meta property="og:title" content="Deven Ballback">
<meta property="og:description" content="Deven Ballback's personal site. Collector of skins.">
<meta property="og:url" content="https://devenballback.skin/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Deven Ballback">
<meta name="twitter:description" content="Deven Ballback's personal site. Collector of skins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest-deep: #122A20;
    --forest: #1E4432;
    --sage: #B7CFB6;
    --cream: #F2EEE1;
    --gold: #C9A855;
    --ink: #0B1712;
    --accent: #C9A855;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--forest-deep);
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    line-height: 1.55;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    position: relative;
    overflow-x: hidden;
  }
  .wrap {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }
  .eyebrow {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage);
    opacity: 0.7;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(34px, 7vw, 48px);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  .tagline {
    color: var(--sage);
    font-size: 15px;
    margin: 0 0 8px;
  }
  .wasm-note {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--sage);
    opacity: 0.5;
    margin: 0 0 8px;
  }
  #idle {
    font-size: 11px;
    color: var(--accent);
    opacity: 0;
    height: 15px;
    margin: 0 0 32px;
    transition: opacity 0.4s ease, color 0.5s ease;
  }
  #idle.show { opacity: 0.75; }

  /* ---------- avatar ---------- */
  #avatar-frame {
    width: 132px;
    height: 132px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 62px;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.06), transparent 70%);
    border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 36px -6px var(--accent);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.5s ease, box-shadow 0.5s ease, transform 0.15s ease;
  }
  #avatar-frame:active { transform: scale(0.96); }
  #avatar-stat {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    color: var(--sage);
    opacity: 0.75;
    margin-bottom: 10px;
    transition: color 0.5s ease;
  }
  #avatar-stat b { color: var(--accent); font-weight: 600; transition: color 0.5s ease; }

  #combo {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    padding: 3px 10px;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(-3px) scale(0.9);
    transition: opacity 0.2s ease, transform 0.2s ease, color 0.5s ease, background 0.5s ease, border-color 0.5s ease;
    margin-bottom: 24px;
    height: 20px;
  }
  #combo.show { opacity: 1; transform: translateY(0) scale(1); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: var(--accent);
    border: none;
    padding: 13px 26px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(0.98); }

  .links {
    margin-top: 44px;
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .links a {
    font-size: 13px;
    color: var(--sage);
    opacity: 0.75;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: opacity 0.2s ease, border-color 0.2s ease;
  }
  .links a:hover { opacity: 1; border-color: var(--sage); }

  /* ---------- toast ---------- */
  #toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translate(-50%, -14px);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--accent);
    padding: 10px 18px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: nowrap;
    z-index: 20;
    font-weight: 600;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    top: 0; left: 0;
    will-change: transform, opacity;
    z-index: 5;
  }

  /* ---------- skindex overlay ---------- */
  #skindex-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 12, 9, 0.85);
    backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    overflow-y: auto;
    padding: 40px 20px;
  }
  #skindex-overlay.show { opacity: 1; pointer-events: auto; }
  #skindex-panel { width: min(520px, 100%); text-align: center; }
  #skindex-panel h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 26px;
    margin: 0 0 4px;
    color: var(--accent);
    transition: color 0.5s ease;
  }
  #skindex-sub {
    font-size: 12.5px;
    color: var(--sage);
    opacity: 0.7;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-bottom: 26px;
  }
  #skindex-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 12px;
  }
  .skindex-tile {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 16px 8px 12px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .skindex-tile:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
  .skindex-tile.active { border-color: var(--accent); }
  .skindex-tile.locked { cursor: default; opacity: 0.5; }
  .skindex-tile.locked:hover { background: rgba(255,255,255,0.05); transform: none; }
  .skindex-emoji { font-size: 32px; line-height: 1; }
  .skindex-name { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--cream); opacity: 0.85; }
  .skindex-lock { font-size: 10px; color: var(--sage); opacity: 0.6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .skindex-mult { font-size: 10px; color: var(--accent); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; transition: color 0.5s ease; }
  #skindex-close {
    margin-top: 28px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--cream);
    font-size: 13px;
    font-family: 'Manrope', sans-serif;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  #skindex-close:hover { background: rgba(255,255,255,0.08); }
</style>
</head>
<body>
  <div id="toast"></div>

  <div class="wrap">
    <div class="eyebrow">devenballback.skin</div>
    <h1>Deven Ballback</h1>
    <p class="tagline">Collector of skins. Ballback by trade.</p>
    <p class="wasm-note">Skindex engine: C++ → WebAssembly</p>
    <div id="idle">🪙 passive income active — +2 pts every few seconds</div>

    <div id="avatar-frame" title="click to earn progress"></div>
    <div id="avatar-stat"><b id="skin-name"></b> · <span id="click-count">0</span> pts</div>
    <div id="combo"></div>

    <button class="btn" id="skindexbtn">Open Skindex</button>

    <div class="links">
      <a href="https://deven.autos" target="_blank" rel="noopener">deven.autos</a>
      <a href="https://intervention.website" target="_blank" rel="noopener">intervention.website</a>
      <a href="https://github.com/Blpcky" target="_blank" rel="noopener">github</a>
    </div>
  </div>

  <div id="skindex-overlay">
    <div id="skindex-panel">
      <h2>Skindex</h2>
      <div id="skindex-sub"></div>
      <div id="skindex-grid"></div>
      <button id="skindex-close">close</button>
    </div>
  </div>

<!--
  All application state (click count, unlocked skins, particle physics)
  lives in C++, compiled to WebAssembly (see wasm/src/). This script is
  just a thin shell: it forwards DOM events into the wasm module and
  lets the module's own bridge functions (wasm/src/bridge.hpp) write
  back to the DOM. See wasm/build.sh to rebuild skinapp.wasm.
-->
<script src="skinapp.js"></script>
<script>
(function () {
  var avatar = document.getElementById('avatar-frame');
  var skindexbtn = document.getElementById('skindexbtn');
  var overlay = document.getElementById('skindex-overlay');
  var closeBtn = document.getElementById('skindex-close');

  function ready(fn) {
    if (typeof Module !== 'undefined' && Module.calledRun) fn();
    else Module.onRuntimeInitialized = fn;
  }

  ready(function () {
    Module.ccall('app_init', null, [], []);

    document.addEventListener('click', function (e) {
      if (overlay.classList.contains('show')) return;
      if (e.target === avatar || e.target === skindexbtn) return;
      Module.ccall('app_background_click', null, ['number', 'number'], [e.clientX, e.clientY]);
    });

    avatar.addEventListener('click', function (e) {
      e.stopPropagation();
      Module.ccall('app_avatar_click', null, ['number', 'number'], [e.clientX, e.clientY]);
    });

    skindexbtn.addEventListener('click', function (e) {
      e.stopPropagation();
      Module.ccall('app_skindex_open', null, [], []);
    });

    closeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      Module.ccall('app_skindex_close', null, [], []);
    });

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        e.stopPropagation();
        Module.ccall('app_skindex_close', null, [], []);
      }
    });
    // Tile clicks inside the Skindex grid are wired up directly in
    // bridge.hpp's js_skindex_add_tile, since the tiles are created
    // from C++ and don't exist yet at page-load time.
  });
})();
</script>
</body>
</html>
